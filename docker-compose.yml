services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    restart: always

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5002"
    restart: always

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5003:5003"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: always
